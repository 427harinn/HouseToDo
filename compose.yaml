services:
  app:
    build:
      context: .
    working_dir: /workspace
    command: npm run dev
    ports:
      - "5174:5173"
    volumes:
      - ./src:/workspace/src
      - ./worker:/workspace/worker
      - ./migrations:/workspace/migrations
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./.git:/workspace/.git
      - ./index.html:/workspace/index.html
      - ./README.md:/workspace/README.md
      - ./package.json:/workspace/package.json
      - ./package-lock.json:/workspace/package-lock.json
      - ./tsconfig.json:/workspace/tsconfig.json
      - ./vite.config.ts:/workspace/vite.config.ts
      - ./eslint.config.js:/workspace/eslint.config.js
      - ./.prettierrc.json:/workspace/.prettierrc.json
      - ./.gitattributes:/workspace/.gitattributes
      - ./.gitignore:/workspace/.gitignore
      - ./.dockerignore:/workspace/.dockerignore
      - ./.env.example:/workspace/.env.example
      - ./.dev.vars.example:/workspace/.dev.vars.example
      - ./Dockerfile:/workspace/Dockerfile
      - ./compose.yaml:/workspace/compose.yaml
      - ./wrangler.jsonc:/workspace/wrangler.jsonc
      - node_modules:/workspace/node_modules
      - build_dist:/workspace/dist
      - wrangler_state:/workspace/.wrangler
    environment:
      NODE_ENV: development
      APP_ENV: development
      ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174,http://app:5173,http://web:5173
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - path: ./.dev.vars
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases:
          - web
  worker:
    build:
      context: .
    working_dir: /workspace
    command: sh -c "npm run build && npm run cf:dev"
    ports:
      - "8787:8787"
    volumes:
      - ./src:/workspace/src
      - ./worker:/workspace/worker
      - ./migrations:/workspace/migrations
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./.git:/workspace/.git
      - ./index.html:/workspace/index.html
      - ./README.md:/workspace/README.md
      - ./package.json:/workspace/package.json
      - ./package-lock.json:/workspace/package-lock.json
      - ./tsconfig.json:/workspace/tsconfig.json
      - ./vite.config.ts:/workspace/vite.config.ts
      - ./eslint.config.js:/workspace/eslint.config.js
      - ./.prettierrc.json:/workspace/.prettierrc.json
      - ./.gitattributes:/workspace/.gitattributes
      - ./.gitignore:/workspace/.gitignore
      - ./.dockerignore:/workspace/.dockerignore
      - ./.env.example:/workspace/.env.example
      - ./.dev.vars.example:/workspace/.dev.vars.example
      - ./Dockerfile:/workspace/Dockerfile
      - ./compose.yaml:/workspace/compose.yaml
      - ./wrangler.jsonc:/workspace/wrangler.jsonc
      - node_modules:/workspace/node_modules
      - build_dist:/workspace/dist
      - wrangler_state:/workspace/.wrangler
    environment:
      NODE_ENV: development
      APP_ENV: development
      ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174,http://app:5173,http://web:5173
    env_file:
      - path: ./.dev.vars
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /workspace
    command: npm run test:e2e
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - ./src:/workspace/src
      - ./worker:/workspace/worker
      - ./migrations:/workspace/migrations
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./e2e:/workspace/e2e
      - ./artifacts:/workspace/artifacts
      - ./index.html:/workspace/index.html
      - ./README.md:/workspace/README.md
      - ./package.json:/workspace/package.json
      - ./package-lock.json:/workspace/package-lock.json
      - ./tsconfig.json:/workspace/tsconfig.json
      - ./vite.config.ts:/workspace/vite.config.ts
      - ./playwright.config.ts:/workspace/playwright.config.ts
      - ./eslint.config.js:/workspace/eslint.config.js
      - ./.prettierrc.json:/workspace/.prettierrc.json
      - ./.gitattributes:/workspace/.gitattributes
      - ./.gitignore:/workspace/.gitignore
      - ./.dockerignore:/workspace/.dockerignore
      - ./.env.example:/workspace/.env.example
      - ./.dev.vars.example:/workspace/.dev.vars.example
      - ./Dockerfile:/workspace/Dockerfile
      - ./compose.yaml:/workspace/compose.yaml
      - ./wrangler.jsonc:/workspace/wrangler.jsonc
      - node_modules:/workspace/node_modules
      - e2e_playwright_cache:/ms-playwright
    environment:
      NODE_ENV: development
      PLAYWRIGHT_BASE_URL: http://web:5173
      PLAYWRIGHT_ARTIFACT_DIR: artifacts/playwright/task-ui
      HOME: /tmp/playwright-home

volumes:
  node_modules:
  build_dist:
  wrangler_state:
  e2e_playwright_cache:
